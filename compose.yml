services:
  mcp-gateway:
    build:
      context: .
    restart: unless-stopped
    environment:
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-8787}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?N8N_WEBHOOK_TOKEN is required}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-120000}
    ports:
      - "${MCP_PORT:-8787}:${MCP_PORT:-8787}"
    depends_on:
      n8n:
        condition: service_started
    networks:
      - mimir
    security_opt:
      - no-new-privileges:true

  repo-scanner:
    build:
      context: .
    command: ["node", "dist/scanner/index.js"]
    restart: unless-stopped
    environment:
      SCANNER_HOST: ${SCANNER_HOST:-0.0.0.0}
      SCANNER_PORT: ${SCANNER_PORT:-8790}
      SCANNER_AUTH_TOKEN: ${SCANNER_AUTH_TOKEN:?SCANNER_AUTH_TOKEN is required}
      SCANNER_TIMEOUT_MS: ${SCANNER_TIMEOUT_MS:-120000}
      SCANNER_GIT_DEPTH: ${SCANNER_GIT_DEPTH:-80}
      SCANNER_MAX_FILES: ${SCANNER_MAX_FILES:-180}
      SCANNER_MAX_FILE_BYTES: ${SCANNER_MAX_FILE_BYTES:-262144}
      SCANNER_MAX_TOTAL_BYTES: ${SCANNER_MAX_TOTAL_BYTES:-4194304}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    networks:
      - mimir
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    restart: unless-stopped
    environment:
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      repo-scanner:
        condition: service_started
    networks:
      - mimir

networks:
  mimir:
    driver: bridge

volumes:
  n8n_data:
