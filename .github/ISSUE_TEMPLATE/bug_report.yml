name: Bug report
description: Report a reproducible Mimir problem
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please avoid posting real secrets, private repository contents or provider tokens.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - MCP gateway
        - n8n workflow
        - Repository scanner
        - Agent runner
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.3.0 or commit SHA"

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a public/sanitized repository when possible.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials and private repository content before pasting logs.
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private repository data from this report.
          required: true
